apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: healthbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: healthbridge-python:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: healthbridge
spec:
  selector:
    app: python-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
