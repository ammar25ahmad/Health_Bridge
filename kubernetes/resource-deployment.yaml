apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: healthbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: healthbridge-resource:latest
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: healthbridge-config
            - secretRef:
                name: healthbridge-secrets
          env:
            - name: PORT
              value: "5002"
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: healthbridge
spec:
  selector:
    app: resource-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
