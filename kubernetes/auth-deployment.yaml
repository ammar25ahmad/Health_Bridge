apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: healthbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: healthbridge-auth:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: healthbridge-config
            - secretRef:
                name: healthbridge-secrets
          env:
            - name: PORT
              value: "5001"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: healthbridge
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
