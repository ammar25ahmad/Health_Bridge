apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: healthbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: healthbridge-gateway:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: healthbridge-config
            - secretRef:
                name: healthbridge-secrets
          env:
            - name: GATEWAY_PORT
              value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: healthbridge
spec:
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
  type: LoadBalancer
