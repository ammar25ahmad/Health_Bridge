apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healthbridge-ai:latest
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: healthbridge-config
            - secretRef:
                name: healthbridge-secrets
          env:
            - name: PORT
              value: "5003"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: healthbridge
spec:
  selector:
    app: ai-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP
