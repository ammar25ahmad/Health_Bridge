services:
  mongodb:
    image: mongo:7
    container_name: healthbridge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - healthbridge-net

  auth-service:
    build: ./auth-service
    container_name: healthbridge-auth
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/healthbridge
      - JWT_SECRET=healthbridge-dev-secret-key-2026
      - PORT=5001
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - healthbridge-net

  resource-service:
    build: ./resource-service
    container_name: healthbridge-resource
    ports:
      - "5002:5002"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/healthbridge
      - JWT_SECRET=healthbridge-dev-secret-key-2026
      - PORT=5002
      - PYTHON_SERVICE_URL=http://python-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - python-service
    networks:
      - healthbridge-net

  python-service:
    build: ./python-service
    container_name: healthbridge-python
    ports:
      - "8000:8000"
    networks:
      - healthbridge-net

  ai-service:
    build: ./ai-service
    container_name: healthbridge-ai
    ports:
      - "5003:5003"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - RESOURCE_SERVICE_URL=http://resource-service:5002
      - PORT=5003
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - resource-service
      - python-service
    networks:
      - healthbridge-net

  api-gateway:
    build: ./api-gateway
    container_name: healthbridge-gateway
    ports:
      - "5000:5000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - RESOURCE_SERVICE_URL=http://resource-service:5002
      - AI_SERVICE_URL=http://ai-service:5003
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - auth-service
      - resource-service
      - ai-service
    networks:
      - healthbridge-net

  frontend:
    build: ./frontend
    container_name: healthbridge-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    networks:
      - healthbridge-net

volumes:
  mongo-data:

networks:
  healthbridge-net:
    driver: bridge
